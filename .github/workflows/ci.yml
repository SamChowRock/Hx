name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # hx-template:exclude-start tutorial
      - run: pnpm tutorial:check
      - name: Check whether code changes received tutorial review
        env:
          TUTORIAL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm tutorial:impact:check
      # hx-template:exclude-end tutorial
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run authentication and authorization E2E tests
        run: |
          docker compose up --detach --wait postgres minio
          pnpm prisma:migrate:deploy
          pnpm test:e2e
      - name: Clean up E2E database
        if: always()
        run: docker compose down --volumes || true
      - run: pnpm build
      - run: docker compose config --quiet
      - run: docker compose build migration api worker
      - name: Smoke test API and Worker containers
        run: |
          docker compose up --detach --wait api worker
          curl --fail --silent http://127.0.0.1:3000/api/health/ready
          test "$(docker compose ps --status running --services worker)" = "worker"
      - name: Print smoke-test container logs
        if: failure()
        run: |
          docker compose logs api worker migration || true
      - name: Clean up smoke-test containers
        if: always()
        run: docker compose down --volumes || true
