name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose config --quiet
      - run: docker build --tag nestjs-production-scaffold:ci .
      - name: Smoke test API and Worker containers
        run: |
          docker run --detach --name scaffold-api nestjs-production-scaffold:ci
          docker run --detach --name scaffold-worker nestjs-production-scaffold:ci node dist/apps/worker/src/main.js
          for attempt in $(seq 1 15); do
            if test "$(docker inspect --format '{{.State.Running}}' scaffold-api)" != "true"; then
              echo 'API container exited before it became ready.'
              exit 1
            fi

            if docker exec scaffold-api node -e "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi

            sleep 1
          done

          docker exec scaffold-api node -e "fetch('http://127.0.0.1:3000/api/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
          test "$(docker inspect --format '{{.State.Running}}' scaffold-worker)" = "true"
      - name: Print smoke-test container logs
        if: failure()
        run: |
          docker logs scaffold-api || true
          docker logs scaffold-worker || true
      - name: Clean up smoke-test containers
        if: always()
        run: docker rm --force scaffold-api scaffold-worker || true
